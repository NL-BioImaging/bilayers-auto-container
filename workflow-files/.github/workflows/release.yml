name: Release

# Releases a new version of this workflow, run by hand (Actions > Release > Run workflow, or
# `gh workflow run release.yml -f version=vX.Y.Z`) on the default branch. Its order makes sure
# the image exists before anything points to it:
#   1. set docker_image.tag in config.yaml to the version and commit it (not pushed yet);
#   2. validate and test that commit, build its image and, when PUBLISH is "true", push
#      <org>/<name>:<version> (and :latest) to the registry in config.yaml;
#   3. only then push the commit, tag it with the version and create the GitHub release.
# The Slurm client (BIOMERO) reads config.yaml at a release tag and pulls the image named there,
# so a tag never exists without its image, and the image contains the config.yaml of its tag.
# If any step before 3 fails, nothing is published or released.
#
# PUBLISH is set when the workflow repository is created: "true" only when a registry and
# namespace were given for the image (docker_image.org, e.g. <org> for Docker Hub or
# quay.io/<org>). Publishing needs that registry's credentials as repository (or organization)
# secrets: REGISTRY_USERNAME and REGISTRY_TOKEN, or DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
# Pushing the version commit needs write access to the default branch: when it is protected,
# allow GitHub Actions to bypass the protection (or the push in step 3 fails).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.0 (becomes docker_image.tag, the git tag and the image tag)"
        required: true
        type: string

env:
  PUBLISH: "false"
  VERSION: ${{ inputs.version }}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || secrets.DOCKERHUB_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Run on the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Run the release on ${{ github.event.repository.default_branch }}, not ${{ github.ref }}"
          exit 1
      - name: Version format
        run: |
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version must look like v1.2.3 (or v1.2.3-rc.1), got '$VERSION'"
            exit 1
          fi
          case "$VERSION" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version not released yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::$VERSION is already tagged; release a new version instead of reusing a tag"
            exit 1
          fi
      - name: Set docker_image.tag in config.yaml
        # edits only the tag line of the docker_image block, keeping the file's comments and layout
        run: |
          python3 - <<'PY'
          import os, re, yaml
          version = os.environ["VERSION"]
          text = open("config.yaml", encoding="utf-8").read()
          block = re.search(r"(?m)^docker_image:[ \t]*\n((?:(?:[ \t]+[^\n]*)?(?:\n|\Z))*)", text)
          if not block:
              raise SystemExit("config.yaml has no docker_image block")
          body, n = re.subn(r"(?m)^([ \t]+tag:[ \t]*)[^\n#]*?([ \t]*(?:#[^\n]*)?)$",
                            lambda m: f'{m.group(1)}"{version}"{m.group(2)}', block.group(1), count=1)
          if n != 1:
              raise SystemExit("config.yaml: docker_image has no tag")
          text = text[:block.start(1)] + body + text[block.end(1):]
          assert yaml.safe_load(text)["docker_image"]["tag"] == version
          open("config.yaml", "w", encoding="utf-8").write(text)
          PY
      - name: Image name and registry from config.yaml
        id: image
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          image = yaml.safe_load(open("config.yaml"))["docker_image"]
          print(f"name={image['org']}/{image['name']}")
          host = image["org"].split("/")[0]
          print(f"registry={host if '.' in host or ':' in host else ''}")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate and test the release
        run: |
          pip install -r requirements-dev.txt
          bilayers-auto validate config.yaml --slurm
          pytest -m "not container"
      - name: Commit the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git diff --cached --quiet || git commit -m "Release $VERSION"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Registry credentials present
        if: env.PUBLISH == 'true'
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::PUBLISH is true but the REGISTRY_* (or DOCKERHUB_*) secrets are missing"
            exit 1
          fi
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # the checked-out folder with the version commit; the default (git) context would
          # build the pushed branch, without the new docker_image.tag
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.REVISION }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ${{ env.PRERELEASE == 'false' && format('{0}:latest', steps.image.outputs.name) || '' }}
      - name: Image is in the registry
        if: env.PUBLISH == 'true'
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:$VERSION"
      - name: Push the version commit and tag
        run: |
          git push origin "HEAD:refs/heads/${{ github.event.repository.default_branch }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          [ "$PRERELEASE" = "true" ] && flags="$flags --prerelease"
          [ "$PUBLISH" = "true" ] && notes="Image: \`${{ steps.image.outputs.name }}:$VERSION\`" \
            || notes="The image was built but not published (no registry configured)."
          gh release create "$VERSION" --title "$VERSION" --notes "$notes" $flags
